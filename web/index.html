<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>try{localStorage.getItem("bne.fonts.v2")&&document.documentElement.classList.add("fonts")}catch{}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfbf9" />
    <meta
      name="description"
      content="Browse made-up brand names by sound, see which .com domains are possibly available, and keep a shortlist."
    />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>Brand name explorer</title>
  </head>
  <body>
    <header class="appbar">
      <a class="wordmark" href="./" aria-label="Brand name explorer"><i class="mark" aria-hidden="true"></i><span>Brand name explorer</span></a>
      <nav class="tabs" aria-label="Sections" role="tablist">
        <button role="tab" id="tab-explore" aria-label="Explore" title="Explore" aria-controls="panel-explore" aria-selected="true" tabindex="0" data-tab="explore"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="tab-label">Explore</span></button>
        <button role="tab" id="tab-reverse" aria-label="Reverse" title="Reverse" aria-controls="panel-reverse" aria-selected="false" tabindex="-1" data-tab="reverse"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span class="tab-label">Reverse</span></button>
        <button role="tab" id="tab-saved" aria-label="Shortlist" title="Shortlist" aria-controls="panel-saved" aria-selected="false" tabindex="-1" data-tab="saved"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.4-9.2-9.3C1.6 7.2 3.8 4.5 7 4.5c2.1 0 3.8 1.1 5 2.9 1.2-1.8 2.9-2.9 5-2.9 3.2 0 5.4 2.7 4.2 6.2C19.5 15.6 12 20 12 20z"/></svg><span class="tab-label">Shortlist</span> <span class="badge" id="saved-count" data-n="0">0</span></button>
      </nav>
      <div class="app-tools">
        <button type="button" id="open-history" class="icon-btn" aria-label="Search history" title="Search history" aria-haspopup="dialog" aria-controls="history-sheet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4v5h5M3.5 8.5a9 9 0 1 1-.3 6M12 7v5l3 2"/></svg></button>
        <button type="button" id="open-settings" class="icon-btn" aria-label="Settings" title="Settings" aria-haspopup="dialog" aria-controls="settings-sheet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-.7 2.3-2 .9-2.2-.6-2 3.4 1.5 1.7v2.6L2.1 15l2 3.4 2.2-.6 2 .9L9 21h4l.7-2.3 2-.9 2.2.6 2-3.4-1.5-1.7v-2.6L19.9 9l-2-3.4-2.2.6-2-.9L13 3z"/><circle cx="11" cy="12" r="3"/></svg></button>
        <a id="github-link" class="icon-btn" href="https://github.com/Govind-S-B/brand-name-explorer" target="_blank" rel="noopener" aria-label="GitHub repository (opens in a new tab)" title="GitHub repository"><svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .8a11.2 11.2 0 0 0-3.54 21.83c.56.1.77-.24.77-.54v-2.1c-3.14.68-3.8-1.34-3.8-1.34-.51-1.3-1.25-1.65-1.25-1.65-1.03-.7.08-.69.08-.69 1.14.08 1.74 1.17 1.74 1.17 1.01 1.73 2.65 1.23 3.3.94.1-.73.4-1.23.72-1.51-2.5-.29-5.13-1.25-5.13-5.57 0-1.23.44-2.24 1.16-3.03-.12-.29-.5-1.43.11-2.98 0 0 .95-.3 3.08 1.16a10.8 10.8 0 0 1 5.6 0c2.14-1.45 3.08-1.16 3.08-1.16.61 1.55.23 2.69.12 2.98.72.79 1.15 1.8 1.15 3.03 0 4.33-2.63 5.28-5.14 5.56.4.35.76 1.04.76 2.1v3.09c0 .3.2.65.78.54A11.2 11.2 0 0 0 12 .8z"/></svg></a>
      </div>
      <span class="net" id="net" data-online="true"><i aria-hidden="true"></i><span id="net-label">Online</span></span>
    </header>
    <div id="app"></div>
    <footer class="foot">Names are generated on your device · No sign-in · <a href="./cmudict-LICENSE.txt">CMU dictionary licence</a> · <a href="./fonts-LICENSE.txt">Font licences</a></footer>
    <dialog id="name-sheet" class="sheet" aria-labelledby="ns-name">
      <div class="sheet-head">
        <div>
          <button type="button" id="ns-back" class="text-btn" hidden>Back</button>
          <h2 id="ns-name" class="ns-name" tabindex="-1">Name</h2>
          <p class="ns-domain"><span id="ns-domain"></span><span class="ns-check"><span id="ns-status" class="pill"></span><button type="button" id="ns-check" class="icon-btn" aria-label="Check .com availability" title="Check .com availability"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 17.9 17"/></svg></button></span></p>
        </div>
        <button type="button" class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="sheet-body">
        <p id="ns-note" class="ns-note" role="status"></p>
        <div class="ns-actions">
          <button type="button" id="ns-save" class="pill-btn" aria-pressed="false"><i class="heart" aria-hidden="true"></i><span>Save</span></button>
          <button type="button" id="ns-copy" class="pill-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></svg>Copy</button>
          <a id="ns-open" class="pill-btn" href="./" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></svg><span>Open</span></a>
        </div>
        <section class="ns-section" aria-labelledby="ns-sound-title">
          <h3 id="ns-sound-title">Sound</h3>
          <div id="ns-sound"></div>
        </section>
        <section class="ns-section" aria-labelledby="ns-nearby-title">
          <h3 id="ns-nearby-title">Nearby spellings</h3>
          <div id="ns-nearby"></div>
        </section>
      </div>
    </dialog>
    <p id="toast" class="toast" role="status"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
